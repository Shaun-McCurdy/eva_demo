<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EVA — Enghouse Virtual Agent</title>
    <meta name="description" content="Talk to the Enghouse Virtual Agent. Real-time voice, real conversation, live in your browser." />
    <meta name="theme-color" content="#060b18" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Runs before first paint so a returning visitor never sees a flash of
      // the wrong theme. Deliberately inline and dependency-free: anything in
      // the bundle would already be too late. Storage can throw in private
      // windows, so every read is guarded.
      (function () {
        try {
          var saved = localStorage.getItem("eva-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
