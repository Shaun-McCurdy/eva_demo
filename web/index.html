<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EVA — the Enghouse Virtual Agent that resolves</title>
    <meta name="description" content="EVA, the Enghouse Virtual Agent, understands intent, completes the task in your enterprise systems and confirms the outcome — then reports on it alongside your human agents. Talk to it live in your browser." />
    <meta name="theme-color" content="#060b18" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Runs before first paint so a returning visitor never sees a flash of
      // the wrong theme. Deliberately inline and dependency-free: anything in
      // the bundle would already be too late. Storage can throw in private
      // windows, so every read is guarded.
      (function () {
        try {
          var saved = localStorage.getItem("eva-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
